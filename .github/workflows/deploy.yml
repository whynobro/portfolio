name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer push finish rather than
# cancelling it: a half-deployed portfolio is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (site root)
        run: npx vite build

      # The site exactly as submitted with the HWA AG application (Aug 2026),
      # rebuilt from its tag rather than committed as build output. It lives at
      # /hwa/ for reference only and is kept out of search.
      - name: Check out the HWA snapshot
        uses: actions/checkout@v4
        with:
          ref: hwa-submitted
          path: hwa-src

      - name: Build the HWA snapshot (/hwa/)
        working-directory: hwa-src
        run: |
          npm ci
          npx vite build --outDir ../dist/hwa --emptyOutDir
          rm -f ../dist/hwa/CNAME
          sed -i 's|<head>|<head><meta name="robots" content="noindex" />|' ../dist/hwa/index.html
          sed -i 's|rel="canonical" href="https://michaelfischbach.dev/"|rel="canonical" href="https://michaelfischbach.dev/hwa/"|' ../dist/hwa/index.html

      # The shell stays small and the photographs stay OUT of it: a stray
      # re-inline would silently undo the reason assets are split out.
      - name: Verify shells stay small
        run: |
          for shell in dist/index.html dist/hwa/index.html; do
            bytes=$(wc -c < "$shell")
            echo "$shell is $bytes bytes"
            test "$bytes" -lt 102400 || {
              echo "Shell exceeded 100 KB: an asset is probably being inlined again."
              exit 1
            }
          done
          test -d dist/assets || { echo "Expected dist/assets/"; exit 1; }
          test -d dist/hwa/assets || { echo "Expected dist/hwa/assets/"; exit 1; }
          echo "dist contains $(find dist -type f | wc -l) file(s)"

      # The root is addressed to no particular employer, and /general/ must keep
      # forwarding: every non-HWA resume sent before the makeover links there.
      - name: Verify the root names no employer and /general/ forwards
        run: |
          hits=$(find dist -path dist/hwa -prune -o -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) \
                 -exec grep -l "HWA\|Affalterbach\|complete-vehicle\|Lebenslauf" {} + ) || true
          if [ -n "$hits" ]; then
            echo "The root build carries HWA or German copy:"; echo "$hits"; exit 1
          fi
          grep -q 'location.replace' dist/general/index.html || { echo "/general/ no longer forwards."; exit 1; }
          grep -q 'name="robots" content="noindex"' dist/hwa/index.html || { echo "/hwa/ is indexable."; exit 1; }
          echo "Root is employer-neutral; /general/ forwards; /hwa/ is noindex."

      # CNAME is why the custom domain survives a deploy; without it Pages
      # reverts to the github.io URL. It must be at the artifact ROOT only.
      - name: Verify the custom domain survives
        run: |
          test -f dist/CNAME || { echo "dist/CNAME is missing: Pages would drop the custom domain."; exit 1; }
          diff <(cat dist/CNAME) <(printf 'michaelfischbach.dev') >/dev/null || {
            echo "dist/CNAME does not read michaelfischbach.dev:"; cat dist/CNAME; exit 1
          }
          test "$(find dist -name CNAME | wc -l)" -eq 1 || { echo "Stray CNAME below the root."; exit 1; }
          echo "CNAME present at the root and nowhere else."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
