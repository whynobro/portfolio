name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer push finish rather than
# cancelling it — a half-deployed portfolio is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc runs first and independently: it is what catches a German string
      # missing from de.ts, which is the failure this project is most exposed to.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      # The build used to assert dist held exactly one file. That guarded the
      # file:// promise, which cost 7.1 MB gzip of BLOCKING payload on first
      # paint and is no longer wanted (the portfolio ships as a link).
      #
      # What matters now is the opposite: that the shell stays small and the
      # photographs stay OUT of it. A stray re-inline would silently undo the
      # whole reason for splitting, so the shell is capped rather than counted.
      - name: Verify shell stays small
        run: |
          bytes=$(wc -c < dist/index.html)
          echo "dist/index.html is $bytes bytes"
          test "$bytes" -lt 102400 || {
            echo "Shell exceeded 100 KB — an asset is probably being inlined again."
            exit 1
          }
          test -d dist/assets || { echo "Expected dist/assets/"; exit 1; }
          echo "dist contains $(find dist -type f | wc -l) file(s)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
